[package]
name = "docxtplrs"
version = "0.2.0"
edition = "2021"
description = "Rust implementation of python-docx-template (docxtpl): render docx templates with Jinja2 syntax (minijinja), native zip/XML handling, plus optional Python bindings via PyO3"
license = "LGPL-2.1-or-later"
repository = "https://github.com/yiyinzhang/docxtplrs"
homepage = "https://github.com/yiyinzhang/docxtplrs"
readme = "README.md"
keywords = ["docx", "template", "jinja2", "word", "office"]
categories = ["text-processing", "rendering", "parser-implementations"]
exclude = [
    ".venv/",
    ".pytest_cache/",
    "target/",
    "tests/",
    "python/",
    "main.py",
    "uv.lock",
    ".python-version",
    "__pycache__/",
]

[package.metadata.docs.rs]
features = ["python"]

[lib]
name = "docxtplrs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
pyo3 = { version = "0.29", optional = true }
minijinja = { version = "2", features = ["loader", "unicode", "json", "urlencode"] }
zip = { version = "2", default-features = false, features = ["deflate-zlib-ng"] }
fancy-regex = "0.14"
quick-xml = "0.36"
crc32fast = "1"
sha1 = "0.10"
encoding_rs = "0.8"
memchr = "2"
flate2 = "1"
aho-corasick = "1"
